services:
  - type: web
    name: wecho-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_KEY
        sync: false
      - key: TRACCAR_URL
        sync: false
      - key: TRACCAR_USERNAME
        sync: false
      - key: TRACCAR_PASSWORD
        sync: false
      - key: TRACCAR_SYNC_INTERVAL_MS
        value: 10000
